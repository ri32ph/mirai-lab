<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 457" role="img" aria-labelledby="t d" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="t">基準範囲内でも変化を確認</title><desc id="d">基準範囲内で上下する例と、基準範囲内で一定方向に変化する例を比較した模式図。 緑色の背景は基準範囲を表します。架空の模式図であり、数値の変化だけで病気とは判断できません。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="365" fill="white"/><text x="300" y="32" text-anchor="middle" font-size="22" font-weight="bold" fill="#333333">一定の範囲で変動</text><rect x="55" y="48" width="490" height="105" rx="4" fill="#eef4ef"/><polyline points="80,107.5 190,99.0 300,112.6 410,104.1 520,108.35" fill="none" stroke="#397868" stroke-width="4"/><circle cx="80" cy="107.5" r="5" fill="#397868"/><circle cx="190" cy="99.0" r="5" fill="#397868"/><circle cx="300" cy="112.6" r="5" fill="#397868"/><circle cx="410" cy="104.1" r="5" fill="#397868"/><circle cx="520" cy="108.35" r="5" fill="#397868"/><text x="300" y="194" text-anchor="middle" font-size="22" font-weight="bold" fill="#333333">一定方向への変化</text><rect x="55" y="210" width="490" height="105" rx="4" fill="#eef4ef"/><polyline points="80,299.25 190,287.35 300,272.05 410,253.35 520,237.2" fill="none" stroke="#397868" stroke-width="4"/><circle cx="80" cy="299.25" r="5" fill="#397868"/><circle cx="190" cy="287.35" r="5" fill="#397868"/><circle cx="300" cy="272.05" r="5" fill="#397868"/><circle cx="410" cy="253.35" r="5" fill="#397868"/><circle cx="520" cy="237.2" r="5" fill="#397868"/><text x="300" y="350" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">年ごとの検査結果（左から右）</text><text x="535" y="69" text-anchor="end" font-size="16" fill="#597063">基準範囲</text><text x="535" y="230" text-anchor="end" font-size="16" fill="#597063">基準範囲</text><rect x="0" y="365" width="600" height="92" fill="white"/><rect x="12" y="368" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="388" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="410" font-size="15" fill="#333333">緑色の背景は基準範囲を表します。</text><text x="26" y="432" font-size="15" fill="#333333">架空の模式図であり、数値の変化だけで病気とは判断できません。</text></svg>