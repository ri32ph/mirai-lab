<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 412" role="img" aria-labelledby="t d" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="t">尿酸の生成と排泄</title><desc id="d">食品と体内のプリン体から尿酸が生成され、腎臓と腸から排泄されます。 生成と排泄のバランスが尿酸値に関係します。矢印は量の割合を表していません。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="320" fill="white"/><rect x="12" y="12" width="280" height="66" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="152.0" y="52.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">食品由来のプリン体</text><rect x="308" y="12" width="280" height="66" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="448.0" y="52.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">体内のプリン体</text><path d="M152 80 V99 H300 V122" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><path d="M448 80 V99 H300 V122" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><rect x="210" y="128" width="180" height="60" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="300.0" y="165.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">尿酸</text><path d="M300 190 V210 H152 V234" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><path d="M300 190 V210 H448 V234" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><rect x="12" y="240" width="280" height="65" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="152.0" y="279.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">腎臓から排泄</text><rect x="308" y="240" width="280" height="65" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="448.0" y="279.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">腸から排泄</text><rect x="0" y="320" width="600" height="92" fill="white"/><rect x="12" y="323" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="343" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="365" font-size="15" fill="#333333">生成と排泄のバランスが尿酸値に関係します。</text><text x="26" y="387" font-size="15" fill="#333333">矢印は量の割合を表していません。</text></svg>