<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 374" role="img" aria-labelledby="t d" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="t">健診と薬の定期検査の間隔</title><desc id="d">年一度の健診と4週間ごとの定期検査の間隔を比較した模式図。 リウマトレックスの電子添文に記載された4週間ごとの検査を例にした模式図です。薬によって必要な検査や間隔は異なります。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="260" fill="white"/><text x="300" y="26" text-anchor="middle" font-size="23" font-weight="bold" fill="#333333">年に一度の健康診断</text><line x1="40" y1="75" x2="560" y2="75" stroke="#397868" stroke-width="3"/><text x="300" y="60" text-anchor="middle" font-size="19" font-weight="normal" fill="#333333">約1年間</text><rect x="33" y="65" width="14" height="20" rx="2" fill="#397868"/><text x="40" y="110" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">健診</text><rect x="553" y="65" width="14" height="20" rx="2" fill="#397868"/><text x="560" y="110" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">健診</text><text x="300" y="160" text-anchor="middle" font-size="23" font-weight="bold" fill="#333333">4週間ごとの定期検査の例</text><line x1="40" y1="200" x2="560" y2="200" stroke="#397868" stroke-width="3"/><circle cx="40" cy="200" r="7" fill="#397868"/><circle cx="80" cy="200" r="7" fill="#397868"/><circle cx="120" cy="200" r="7" fill="#397868"/><circle cx="160" cy="200" r="7" fill="#397868"/><circle cx="200" cy="200" r="7" fill="#397868"/><circle cx="240" cy="200" r="7" fill="#397868"/><circle cx="280" cy="200" r="7" fill="#397868"/><circle cx="320" cy="200" r="7" fill="#397868"/><circle cx="360" cy="200" r="7" fill="#397868"/><circle cx="400" cy="200" r="7" fill="#397868"/><circle cx="440" cy="200" r="7" fill="#397868"/><circle cx="480" cy="200" r="7" fill="#397868"/><circle cx="520" cy="200" r="7" fill="#397868"/><circle cx="560" cy="200" r="7" fill="#397868"/><text x="300" y="244" text-anchor="middle" font-size="21" font-weight="normal" fill="#333333">薬の安全性を継続的に確認</text><rect x="0" y="260" width="600" height="114" fill="white"/><rect x="12" y="263" width="576" height="101" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="283" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="305" font-size="15" fill="#333333">リウマトレックスの電子添文に記載された4週間ごとの検査を例にした模式</text><text x="26" y="327" font-size="15" fill="#333333">図です。</text><text x="26" y="349" font-size="15" fill="#333333">薬によって必要な検査や間隔は異なります。</text></svg>