<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 402" role="img" aria-labelledby="title" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="title">血糖値とHbA1cが反映する期間</title><desc id="d">血糖値は採血時点、HbA1cは主に過去1～2か月の血糖状態を反映します。 血糖の変動は模式的なもので、実測値ではありません。HbA1cは赤血球の寿命などにも影響されます。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="310" fill="white"/><rect x="18" y="15" width="564" height="160" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="300" y="43" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">血糖値：採血した時点</text><path d="M45 130 L95 114 L145 126 L195 72 L245 119 L295 129 L345 80 L395 117 L445 126 L495 85 L555 116" stroke="#397868" stroke-width="4" fill="none"/><line x1="495" y1="57" x2="495" y2="145" stroke="#333333" stroke-dasharray="5 5"/><circle cx="495" cy="85" r="7" fill="#397868"/><text x="495" y="163" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">採血</text><rect x="18" y="190" width="564" height="105" rx="12" fill="#e7eef5" stroke="#c7d0c8"/><text x="300" y="223" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">HbA1c：主に過去1～2か月</text><text x="300" y="255" text-anchor="middle" font-size="19" font-weight="normal" fill="#333333">赤血球のヘモグロビンに結合した糖の割合</text><text x="300" y="281" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">血糖の状態を振り返る指標</text><rect x="0" y="310" width="600" height="92" fill="white"/><rect x="12" y="313" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="333" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="355" font-size="15" fill="#333333">血糖の変動は模式的なもので、実測値ではありません。</text><text x="26" y="377" font-size="15" fill="#333333">HbA1cは赤血球の寿命などにも影響されます。</text></svg>