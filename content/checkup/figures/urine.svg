<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 372" role="img" aria-labelledby="title" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="title">尿潜血検査が反応する物質</title><desc id="d">尿潜血試験紙は赤血球由来のヘモグロビンや筋肉由来のミオグロビンに反応します。陽性だけでは原因を特定できません。 陽性の場合は、尿沈渣などの追加検査で原因を調べることがあります。月経血の混入などにも注意が必要です。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="280" fill="white"/><rect x="10" y="12" width="180" height="110" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="100" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">赤血球</text><text x="100" y="86" text-anchor="middle" font-size="16" font-weight="normal" fill="#333333">血尿など</text><path d="M100 123 L300 174" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="210" y="12" width="180" height="110" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="300" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">ヘモグロビン</text><text x="300" y="86" text-anchor="middle" font-size="16" font-weight="normal" fill="#333333">赤血球由来の色素</text><path d="M300 123 L300 174" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="410" y="12" width="180" height="110" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="500" y="52" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">ミオグロビン</text><text x="500" y="86" text-anchor="middle" font-size="16" font-weight="normal" fill="#333333">筋肉由来の蛋白質</text><path d="M500 123 L300 174" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="105" y="180" width="390" height="84" rx="12" fill="#e7eef5" stroke="#c7d0c8"/><text x="300" y="213" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">尿潜血試験紙が反応</text><text x="300" y="241" text-anchor="middle" font-size="19" font-weight="normal" fill="#333333">陽性だけでは原因は特定できません</text><rect x="0" y="280" width="600" height="92" fill="white"/><rect x="12" y="283" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="303" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="325" font-size="15" fill="#333333">陽性の場合は、尿沈渣などの追加検査で原因を調べることがあります。</text><text x="26" y="347" font-size="15" fill="#333333">月経血の混入などにも注意が必要です。</text></svg>