<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 417" role="img" aria-labelledby="title" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="title">サプリメントなどによる検査値への影響</title><desc id="d">甘草は体の状態、クレアチンは検査指標の量、ビオチンやビタミンCは測定方法に影響する場合があります。 影響は成分・使用量・測定方法によって異なります。自己判断で中止せず、使用製品を伝えましょう。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="325" fill="white"/><rect x="10" y="10" width="205" height="85" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="112" y="59" text-anchor="middle" font-size="19" font-weight="bold" fill="#333333">甘草</text><path d="M220 52 L255 52" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="10" width="330" height="85" rx="12" fill="#e7eef5" stroke="#c7d0c8"/><text x="425" y="42" text-anchor="middle" font-size="21" font-weight="bold" fill="#333333">体の状態が変わる</text><text x="425" y="72" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">血圧やカリウムに影響</text><rect x="10" y="115" width="205" height="85" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="112" y="164" text-anchor="middle" font-size="19" font-weight="bold" fill="#333333">クレアチン</text><path d="M220 157 L255 157" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="115" width="330" height="85" rx="12" fill="#e7eef5" stroke="#c7d0c8"/><text x="425" y="147" text-anchor="middle" font-size="21" font-weight="bold" fill="#333333">検査指標の量が変わる</text><text x="425" y="177" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">血清クレアチニンに影響</text><rect x="10" y="220" width="205" height="85" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="112" y="269" text-anchor="middle" font-size="19" font-weight="bold" fill="#333333">ビオチン・ビタミンC</text><path d="M220 262 L255 262" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="260" y="220" width="330" height="85" rx="12" fill="#e7eef5" stroke="#c7d0c8"/><text x="425" y="252" text-anchor="middle" font-size="21" font-weight="bold" fill="#333333">測定方法に干渉する</text><text x="425" y="282" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">一部の検査結果に影響</text><rect x="0" y="325" width="600" height="92" fill="white"/><rect x="12" y="328" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="348" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="370" font-size="15" fill="#333333">影響は成分・使用量・測定方法によって異なります。</text><text x="26" y="392" font-size="15" fill="#333333">自己判断で中止せず、使用製品を伝えましょう。</text></svg>