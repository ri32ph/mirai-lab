<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 347" role="img" aria-labelledby="t d" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="t">筋肉量とクレアチニンによるeGFR</title><desc id="d">実際のろ過能力、年齢、性別などが同じ場合、筋肉量が少ないとクレアチニンが低めになり、eGFRが高めに推算されることがあります。筋肉量が多い場合は逆です。 実際のろ過能力、年齢、性別など、その他の条件が同じ場合の模式図です。筋肉量だけで腎機能は判断できません。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="255" fill="white"/><rect x="15" y="12" width="270" height="55" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="150.0" y="46.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">筋肉量が少ない</text><path d="M150 70 V94" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><rect x="15" y="98" width="270" height="55" rx="10" fill="#ffffff" stroke="#c7d0c8"/><text x="150.0" y="132.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">クレアチニンが低め</text><path d="M150 156 V180" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><rect x="15" y="184" width="270" height="55" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="150.0" y="218.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">eGFRが高めに推算</text><rect x="315" y="12" width="270" height="55" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="450.0" y="46.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">筋肉量が多い</text><path d="M450 70 V94" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><rect x="315" y="98" width="270" height="55" rx="10" fill="#ffffff" stroke="#c7d0c8"/><text x="450.0" y="132.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">クレアチニンが高め</text><path d="M450 156 V180" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#a)"/><rect x="315" y="184" width="270" height="55" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="450.0" y="218.5" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">eGFRが低めに推算</text><rect x="0" y="255" width="600" height="92" fill="white"/><rect x="12" y="258" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="278" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="300" font-size="15" fill="#333333">実際のろ過能力、年齢、性別など、その他の条件が同じ場合の模式図です。</text><text x="26" y="322" font-size="15" fill="#333333">筋肉量だけで腎機能は判断できません。</text></svg>