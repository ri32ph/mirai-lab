<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 224" role="img" aria-labelledby="t d" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="t">再検査と精密検査の目的</title><desc id="d">再検査は状態を改めて確認し、精密検査は原因や病気を詳しく調べます。 必要な検査や時期は結果によって異なります。精密検査を自己判断で再検査に置き換えないでください。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="132" fill="white"/><rect x="12" y="20" width="280" height="96" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="152.0" y="61.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">再検査</text><text x="152.0" y="89.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">改めて状態を確認</text><rect x="308" y="20" width="280" height="96" rx="10" fill="#f6efe1" stroke="#c7d0c8"/><text x="448.0" y="61.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">精密検査</text><text x="448.0" y="89.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">原因・病気を詳しく調べる</text><rect x="0" y="132" width="600" height="92" fill="white"/><rect x="12" y="135" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="155" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="177" font-size="15" fill="#333333">必要な検査や時期は結果によって異なります。</text><text x="26" y="199" font-size="15" fill="#333333">精密検査を自己判断で再検査に置き換えないでください。</text></svg>