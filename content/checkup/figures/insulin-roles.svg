<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 426" role="img" aria-labelledby="t d" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="t">基礎インスリンと追加インスリンの役割</title><desc id="d">食事に対応する追加インスリンと、食事をしない間にも必要な基礎インスリンを示す模式図。 役割の模式図であり、実際の薬の作用時間や投与量を示すものではありません。自己判断で中止・調整しないでください。特に1型糖尿病の方は基礎インスリンを自己判断で中止しないでください。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="290" fill="white"/><text x="300" y="28" text-anchor="middle" font-size="22" font-weight="bold" fill="#333333">食事に対応する追加インスリン</text><rect x="42" y="170" width="530" height="55" rx="4" fill="#bed8c9"/><path d="M55 170 Q98 163 120 65 Q142 119 185 170 Z" fill="#e5bd7f" stroke="#ad8043"/><text x="120" y="250" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">朝食</text><path d="M235 170 Q278 163 300 65 Q322 119 365 170 Z" fill="#e5bd7f" stroke="#ad8043"/><text x="300" y="250" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">昼食</text><path d="M415 170 Q458 163 480 65 Q502 119 545 170 Z" fill="#e5bd7f" stroke="#ad8043"/><text x="480" y="250" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">夕食</text><text x="307" y="204" text-anchor="middle" font-size="23" font-weight="bold" fill="#333333">基礎インスリン</text><path d="M42 48 V225 H575" stroke="#333333" fill="none"/><text x="550" y="278" text-anchor="middle" font-size="18" font-weight="normal" fill="#333333">時間</text><rect x="0" y="290" width="600" height="136" fill="white"/><rect x="12" y="293" width="576" height="123" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="313" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="335" font-size="15" fill="#333333">役割の模式図であり、実際の薬の作用時間や投与量を示すものではありませ</text><text x="26" y="357" font-size="15" fill="#333333">ん。</text><text x="26" y="379" font-size="15" fill="#333333">自己判断で中止・調整しないでください。</text><text x="26" y="401" font-size="15" fill="#333333">特に1型糖尿病の方は基礎インスリンを自己判断で中止しないでください。</text></svg>