<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 442" role="img" aria-labelledby="title" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="title">腎臓を評価する二つの視点</title><desc id="d">eGFRはろ過能力の推算値、尿蛋白は尿への蛋白質の排出を評価します。 eGFRは腎機能の残存割合ではありません。筋肉量などの影響も受けます。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="350" fill="white"/><rect x="160" y="12" width="280" height="65" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="300" y="51" text-anchor="middle" font-size="25" font-weight="bold" fill="#333333">血液</text><path d="M300 78 L300 108" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="115" y="112" width="370" height="75" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><text x="300" y="144" text-anchor="middle" font-size="24" font-weight="bold" fill="#333333">腎臓で血液をろ過</text><text x="300" y="172" text-anchor="middle" font-size="17" font-weight="normal" fill="#333333">必要な物質を再吸収する働きもあります</text><path d="M220 188 L150 225" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><path d="M380 188 L450 225" fill="none" stroke="#397868" stroke-width="3" marker-end="url(#arrow)"/><rect x="10" y="230" width="280" height="108" rx="12" fill="#eef4ef" stroke="#c7d0c8"/><rect x="310" y="230" width="280" height="108" rx="12" fill="#e7eef5" stroke="#c7d0c8"/><text x="150" y="265" text-anchor="middle" font-size="25" font-weight="bold" fill="#333333">eGFR</text><text x="150" y="295" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">ろ過能力の推算値</text><text x="150" y="320" text-anchor="middle" font-size="17" font-weight="normal" fill="#333333">血液検査などから推算</text><text x="450" y="265" text-anchor="middle" font-size="25" font-weight="bold" fill="#333333">尿蛋白</text><text x="450" y="295" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">尿への蛋白質の排出</text><text x="450" y="320" text-anchor="middle" font-size="17" font-weight="normal" fill="#333333">尿検査で確認</text><rect x="0" y="350" width="600" height="92" fill="white"/><rect x="12" y="353" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="373" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="395" font-size="15" fill="#333333">eGFRは腎機能の残存割合ではありません。</text><text x="26" y="417" font-size="15" fill="#333333">筋肉量などの影響も受けます。</text></svg>