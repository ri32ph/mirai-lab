<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 457" role="img" aria-labelledby="t d" font-family="Hiragino Sans,Yu Gothic,Meiryo,Noto Sans CJK JP,sans-serif"><title id="t">健康状態に関係するさまざまな要因</title><desc id="d">健康状態には遺伝、食生活、身体活動、生活環境、病気や薬、年齢が関係します。 各要因の影響の大きさを示すものではありません。検査値だけで本人の取り組みを評価することはできません。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#397868"/></marker></defs><rect width="600" height="365" fill="white"/><line x1="300" y1="45" x2="300" y2="185" stroke="#a1b8aa" stroke-width="3"/><line x1="100" y1="125" x2="300" y2="185" stroke="#a1b8aa" stroke-width="3"/><line x1="500" y1="125" x2="300" y2="185" stroke="#a1b8aa" stroke-width="3"/><line x1="100" y1="245" x2="300" y2="185" stroke="#a1b8aa" stroke-width="3"/><line x1="500" y1="245" x2="300" y2="185" stroke="#a1b8aa" stroke-width="3"/><line x1="300" y1="325" x2="300" y2="185" stroke="#a1b8aa" stroke-width="3"/><rect x="212" y="20" width="176" height="50" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="300.0" y="52.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">遺伝・体質</text><rect x="12" y="100" width="176" height="50" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="100.0" y="132.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">食生活</text><rect x="412" y="100" width="176" height="50" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="500.0" y="132.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">身体活動</text><rect x="12" y="220" width="176" height="50" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="100.0" y="252.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">生活環境</text><rect x="412" y="220" width="176" height="50" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="500.0" y="252.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">病気・薬</text><rect x="212" y="300" width="176" height="50" rx="10" fill="#eef4ef" stroke="#c7d0c8"/><text x="300.0" y="332.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">年齢</text><rect x="213" y="150" width="174" height="70" rx="10" fill="#d9ebdd" stroke="#c7d0c8"/><text x="300.0" y="178.0" text-anchor="middle" font-size="20" font-weight="bold" fill="#333333">健康状態</text><text x="300.0" y="206.0" text-anchor="middle" font-size="20" font-weight="normal" fill="#333333">検査値</text><rect x="0" y="365" width="600" height="92" fill="white"/><rect x="12" y="368" width="576" height="79" rx="8" fill="#f3f6f0" stroke="#c8d0c4"/><text x="26" y="388" font-size="15" font-weight="bold" fill="#48664e">図を見るときの注意</text><text x="26" y="410" font-size="15" fill="#333333">各要因の影響の大きさを示すものではありません。</text><text x="26" y="432" font-size="15" fill="#333333">検査値だけで本人の取り組みを評価することはできません。</text></svg>